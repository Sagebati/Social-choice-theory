[package]
name = "social-choice-api"
version = "0.1.0"
description = "Axum API over the social-choice crate, deployed as a Cloudflare Worker."
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
social-choice = { path = "../crates/social-choice" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-service = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["http", "axum"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
futures-executor = "0.3"
tower = { version = "0.5", default-features = false, features = ["util"] }
