# Cloudflare Worker: the Rust/Axum API under /api/*, and the built Vue app as
# static assets for every other path.
name = "social-choice"
main = "build/index.js"
compatibility_date = "2025-09-01"

[build]
# Builds the Worker. Build the front end (frontend/dist) first; see the README.
command = "cargo install -q worker-build@^0.8 && worker-build --release"

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
# Only API calls reach the Worker; everything else is served straight from assets.
run_worker_first = ["/api/*"]

# The heavier endpoints (Yee diagrams, manipulability sweeps, counterexample
# searches) can need more than the free plan's 10 ms of CPU. On a paid plan,
# raise the limit:
# [limits]
# cpu_ms = 30000

[observability]
enabled = true
